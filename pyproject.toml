# Tool configuration only.
#
# OTSE is run as scripts (`streamlit run app.py`, `python -m pipeline.run`) rather
# than installed as a package, so there is no [project] table here and runtime
# dependencies live in requirements.txt as the single source of truth.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.lint.per-file-ignores]
# Streamlit scripts execute top to bottom, so module-level statements follow imports.
"app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
